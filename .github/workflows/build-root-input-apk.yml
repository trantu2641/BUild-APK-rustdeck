name: Build RustDesk Root Input APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-root-input-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      RUST_VERSION: "1.75"
      FLUTTER_VERSION: "3.24.5"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      CARGO_NDK_VERSION: "3.1.2"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      RUSTDESK_REF: "53996e3c404ea5083df0775057e4149e49102084"

    steps:
      - name: Checkout patch kit
        uses: actions/checkout@v4
        with:
          path: patch-kit
          persist-credentials: false

      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_REF }}
          path: rustdesk-src
          submodules: recursive
          persist-credentials: false

      - name: Apply root input patch
        run: |
          set -e
          python3 patch-kit/apply_root_input_patch.py rustdesk-src

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            g++ \
            gcc \
            libc6-dev \
            libclang-dev \
            libssl-dev \
            llvm-dev \
            make \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            perl \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            wget \
            zip \
            yasm \
            ca-certificates \
            autoconf \
            automake \
            libtool

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Generate Flutter Rust bridge
        working-directory: rustdesk-src
        run: |
          set -e

          cargo install flutter_rust_bridge_codegen \
            --version "${FLUTTER_RUST_BRIDGE_VERSION}" \
            --features uuid \
            --locked

          sed -i \
            's/uni_links_desktop/#uni_links_desktop/g' \
            flutter/pubspec.yaml

          cd flutter
          flutter pub get
          cd ..

          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Verify Android NDK sysroot
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          if [ ! -f "${SYSROOT}/usr/include/stdint.h" ]; then
            echo "ERROR: Android NDK stdint.h not found."
            echo "Expected: ${SYSROOT}/usr/include/stdint.h"
            exit 1
          fi

          echo "Android NDK: ${ANDROID_NDK_HOME}"
          echo "Android sysroot: ${SYSROOT}"
          echo "NDK stdint.h exists."

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Build Android native dependencies
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          bash flutter/build_android_deps.sh arm64-v8a

      - name: Build RustDesk native library
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

          # Fix bindgen using Ubuntu headers instead of Android NDK headers.
          BINDGEN_EXTRA_CLANG_ARGS: >-
            --target=aarch64-linux-android21
            --sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot

        run: |
          set -euo pipefail

          rustup target add aarch64-linux-android

          cargo install cargo-ndk \
            --version "${CARGO_NDK_VERSION}" \
            --locked

          bash ./flutter/ndk_arm64.sh

          mkdir -p \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a

          LIB_PATH="./target/aarch64-linux-android/release/liblibrustdesk.so"
          CXX_LIB="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "${LIB_PATH}" ]; then
            echo "ERROR: RustDesk native library was not produced:"
            echo "${LIB_PATH}"
            find target -type f -name 'liblibrustdesk.so' -print || true
            exit 1
          fi

          if [ ! -f "${CXX_LIB}" ]; then
            echo "ERROR: Android libc++_shared.so was not found:"
            echo "${CXX_LIB}"
            find "${ANDROID_NDK_HOME}" -type f -name 'libc++_shared.so' -print || true
            exit 1
          fi

          cp "${LIB_PATH}" \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

          cp "${CXX_LIB}" \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          echo "RustDesk native library built successfully."

      - name: Build RustDesk APK
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -euo pipefail

          sed -i \
            's/signingConfig.release/signingConfig.debug/g' \
            ./flutter/android/app/build.gradle

          cd flutter

          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi

          cd ..

          APK_PATH="flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: APK was not produced at ${APK_PATH}"
            find flutter/build -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "${APK_PATH}" rustdesk-rootinput-arm64.apk

          echo "APK build completed:"
          ls -lh rustdesk-rootinput-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-rootinput-arm64
          path: rustdesk-src/rustdesk-rootinput-arm64.apk
          if-no-files-found: error
          retention-days: 14
