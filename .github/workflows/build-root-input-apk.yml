name: Build RustDesk Root Input APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-root-input-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUST_VERSION: "1.75"
      FLUTTER_VERSION: "3.24.5"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      CARGO_NDK_VERSION: "3.1.2"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      RUSTDESK_REF: "53996e3c404ea5083df0775057e4149e49102084"

    steps:
      - name: Check out patch kit
        uses: actions/checkout@v4
        with:
          path: patch-kit
          persist-credentials: false

      - name: Check out RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_REF }}
          path: rustdesk-src
          submodules: recursive
          persist-credentials: false

      - name: Apply root input patch
        run: python3 patch-kit/apply_root_input_patch.py rustdesk-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget openjdk-17-jdk-headless \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
            libxfixes-dev libasound2-dev libpulse-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install Flutter Rust bridge generator
        working-directory: rustdesk-src
        run: |
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features uuid --locked
          sed -i 's/uni_links_desktop/#uni_links_desktop/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Build Android native dependencies
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash flutter/build_android_deps.sh arm64-v8a

      - name: Build RustDesk native library
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          bash ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: rustdesk-src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          sed -i 's/signingConfig.release/signingConfig.debug/g' ./flutter/android/app/build.gradle
          pushd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          cp ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./rustdesk-rootinput-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-rootinput-arm64
          path: rustdesk-src/rustdesk-rootinput-arm64.apk
          if-no-files-found: error
          retention-days: 14
